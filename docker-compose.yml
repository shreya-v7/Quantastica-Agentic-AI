services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quantastica
      POSTGRES_PASSWORD: quantastica
      POSTGRES_DB: quantastica
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantastica"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./apps/server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      PLATFORM: local
      ALLOW_SEED: "true"
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://quantastica:quantastica@postgres:5432/quantastica
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/exports
    volumes:
      - server-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pg-data:
  server-data:
