name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Tests use testcontainers to spin throwaway Postgres (pgvector) and Redis, so the
    # only host requirement is a working Docker daemon, which GitHub runners provide.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        working-directory: apps/server
        run: ruff check app tests
      - name: Migrations apply cleanly
        working-directory: apps/server
        env:
          ANTHROPIC_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://quantastica:quantastica@localhost:5432/quantastica
        run: |
          docker run -d --name ci-pg -e POSTGRES_USER=quantastica \
            -e POSTGRES_PASSWORD=quantastica -e POSTGRES_DB=quantastica \
            -p 5432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do docker exec ci-pg pg_isready -U quantastica && break; sleep 2; done
          docker exec ci-pg psql -U quantastica -c "CREATE EXTENSION IF NOT EXISTS vector;"
          alembic upgrade head
          docker rm -f ci-pg
      - name: Tests
        working-directory: apps/server
        env:
          ANTHROPIC_API_KEY: ci-placeholder
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build:types
      - run: npm run lint -w @quantastica/web
      - run: npm run typecheck -w @quantastica/web
      - run: npm run test -w @quantastica/web
      - run: npm run build:web

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run check:contract
      - run: python scripts/check_no_emdash.py
